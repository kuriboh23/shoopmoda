<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shoop Moda Style | Product Details</title>
    <style>
        /* Design System Variables */
        :root {
            --primary: #704F38;
            --dark: #1F2029;
            --gray: #797979;
            --light: #EDEDED;
            --white: #FFFFFF;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-sticky: 0 -4px 16px rgba(0, 0, 0, 0.06);
            --transition: all 0.25s ease;
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--white);
            color: var(--dark);
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* Responsive Layout Container */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--white);
            min-height: 100vh;
            position: relative;
            box-shadow: var(--shadow-soft);
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 1000px;
                margin: 24px auto;
                border-radius: 20px;
                overflow: hidden;
                min-height: calc(100vh - 48px);
            }
            body { background-color: #f5f5f5; padding-bottom: 0; }
            .product-layout-desktop {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 32px;
                padding: 24px;
            }
        }

        /* Navigation Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
        }

        @media (min-width: 768px) {
            header { position: relative; padding: 16px 24px; }
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
        }

        .icon-btn {
            background: var(--white);
            border: 1px solid var(--light);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: var(--transition);
        }

        .icon-btn:hover { background: var(--light); }
        .icon-btn svg { width: 20px; height: 20px; fill: var(--dark); transition: var(--transition); }
        .icon-btn.wishlist-btn.active svg { fill: var(--primary); }

        /* Media Gallery Section */
        .gallery-container {
            background-color: var(--light);
            position: relative;
            padding: 72px 16px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (min-width: 768px) {
            .gallery-container {
                padding: 16px;
                border-radius: 16px;
            }
        }

        .main-image-placeholder {
            width: 100%;
            height: 380px;
            background: #D9D9D9;
            border-radius: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gray);
            font-size: 14px;
            font-weight: 500;
        }

        /* Thumbnail Strip */
        .thumbnails-wrapper {
            width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .thumbnails-wrapper::-webkit-scrollbar { display: none; }

        .thumbnails-list {
            display: flex;
            gap: 10px;
        }

        .thumb {
            width: 54px;
            height: 54px;
            border-radius: 10px;
            background: #C4C4C4;
            flex-shrink: 0;
            cursor: pointer;
            border: 2px solid transparent;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumb.active {
            border-color: var(--primary);
        }

        .thumb-more {
            background: var(--dark);
            color: var(--white);
            font-weight: 600;
            font-size: 13px;
        }

        /* Product Details Info Section */
        .details-container {
            padding: 20px 20px 30px;
            background: var(--white);
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .category-subtitle {
            font-size: 13px;
            color: var(--gray);
            font-weight: 500;
        }

        .rating-badge {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            font-weight: 600;
            color: var(--dark);
        }

        .rating-badge svg {
            width: 15px;
            height: 15px;
            fill: #FFB800;
        }

        .product-name {
            font-size: 22px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 20px;
        }

        /* Section Headings */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 8px;
        }

        .description-text {
            font-size: 13px;
            line-height: 1.5;
            color: var(--gray);
            margin-bottom: 24px;
            border-bottom: 1px solid var(--light);
            padding-bottom: 20px;
        }

        .read-more {
            color: var(--dark);
            font-weight: 600;
            text-decoration: underline;
            cursor: pointer;
        }

        /* Size Selection */
        .size-options {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .size-btn {
            min-width: 42px;
            height: 42px;
            padding: 0 12px;
            border-radius: 10px;
            border: 1px solid var(--light);
            background: var(--white);
            color: var(--dark);
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .size-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .size-btn.active {
            background: var(--dark);
            color: var(--white);
            border-color: var(--dark);
        }

        /* Color Selection */
        .color-subtitle {
            font-weight: 400;
            color: var(--gray);
            margin-left: 4px;
        }

        .color-options {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 10px;
        }

        .color-swatch {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--white);
            outline: 1px solid var(--light);
            cursor: pointer;
            transition: var(--transition);
        }

        .color-swatch.active {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* Sticky Action Bar */
        .action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sticky);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 100;
        }

        @media (min-width: 768px) {
            .action-bar {
                position: relative;
                box-shadow: none;
                border-top-left-radius: 0;
                border-top-right-radius: 0;
                border-top: 1px solid var(--light);
                padding: 20px 0 0;
                margin-top: 20px;
            }
        }

        .price-wrapper {
            display: flex;
            flex-direction: column;
        }

        .price-label {
            font-size: 11px;
            color: var(--gray);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .price-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }

        .add-to-cart-btn {
            background: var(--dark);
            color: var(--white);
            border: none;
            padding: 14px 28px;
            border-radius: 28px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .add-to-cart-btn:hover { background: var(--primary); }
        .add-to-cart-btn:active { transform: scale(0.97); }
        .add-to-cart-btn svg { width: 18px; height: 18px; fill: var(--white); }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header Navigation -->
    <header>
        <button class="icon-btn" aria-label="Go Back" onclick="history.back()">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <h1 class="header-title">Product Details</h1>
        <button class="icon-btn wishlist-btn" id="wishlistToggle" aria-label="Add to Wishlist">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
    </header>

    <div class="product-layout-desktop">
        <!-- Media Gallery -->
        <div class="gallery-container">
            <div class="main-image-placeholder">
                Product Image Placeholder
            </div>
            <div class="thumbnails-wrapper">
                <div class="thumbnails-list">
                    <div class="thumb active"></div>
                    <div class="thumb"></div>
                    <div class="thumb"></div>
                    <div class="thumb"></div>
                    <div class="thumb"></div>
                    <div class="thumb thumb-more">+10</div>
                </div>
            </div>
        </div>

        <!-- Details & Options -->
        <div class="details-container">
            <div class="meta-row">
                <span class="category-subtitle">Female's Style</span>
                <div class="rating-badge">
                    <svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
                    4.5
                </div>
            </div>

            <h2 class="product-name">Light Brown Jacket</h2>

            <div class="section-title">Product Details</div>
            <p class="description-text">
                Crafted with premium Turkish textiles for maximum comfort and sophisticated style. Ideal for layered outfits in any season. <span class="read-more">Read more</span>
            </p>

            <div class="section-title">Select Size</div>
            <div class="size-options">
                <button class="size-btn active">S</button>
                <button class="size-btn">M</button>
                <button class="size-btn">L</button>
                <button class="size-btn">XL</button>
                <button class="size-btn">XXL</button>
                <button class="size-btn">XXXL</button>
            </div>

            <div class="section-title">Select Color : <span class="color-subtitle" id="selectedColorName">Brown</span></div>
            <div class="color-options">
                <div class="color-swatch active" style="background-color: #704F38;" data-color="Brown"></div>
                <div class="color-swatch" style="background-color: #1F2029;" data-color="Dark"></div>
                <div class="color-swatch" style="background-color: #C2A691;" data-color="Beige"></div>
            </div>

            <!-- Sticky Bottom / Inline Bar -->
            <div class="action-bar">
                <div class="price-wrapper">
                    <span class="price-label">Total Price</span>
                    <span class="price-value">$83.97</span>
                </div>
                <button class="add-to-cart-btn">
                    <svg viewBox="0 0 24 24"><path d="M18 6h-2c0-2.21-1.79-4-4-4S8 3.79 8 6H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-6-2c1.1 0 2 .9 2 2h-4c0-1.1.9-2 2-2zm6 16H6V8h2v2c0 .55.45 1 1 1s1-.45 1-1V8h4v2c0 .55.45 1 1 1s1-.45 1-1V8h2v12z"/></svg>
                    Add to Cart
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Toggle Wishlist active state
        const wishlistBtn = document.getElementById('wishlistToggle');
        wishlistBtn.addEventListener('click', () => {
            wishlistBtn.classList.toggle('active');
        });

        // Size selection state
        const sizeBtns = document.querySelectorAll('.size-btn');
        sizeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                sizeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        // Color selection state
        const colorSwatches = document.querySelectorAll('.color-swatch');
        const colorNameLabel = document.getElementById('selectedColorName');
        colorSwatches.forEach(swatch => {
            swatch.addEventListener('click', () => {
                colorSwatches.forEach(s => s.classList.remove('active'));
                swatch.classList.add('active');
                colorNameLabel.textContent = swatch.dataset.color;
            });
        });

        // Thumbnail active selection
        const thumbs = document.querySelectorAll('.thumb:not(.thumb-more)');
        thumbs.forEach(thumb => {
            thumb.addEventListener('click', () => {
                thumbs.forEach(t => t.classList.remove('active'));
                thumb.classList.add('active');
            });
        });
    });
</script>

</body>
</html>

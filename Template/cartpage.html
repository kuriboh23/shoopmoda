<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shoop Moda Style | My Cart</title>
    <style>
        /* Design System Variables */
        :root {
            --primary: #704F38;
            --dark: #1F2029;
            --gray: #797979;
            --light: #EDEDED;
            --white: #FFFFFF;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-bottom-sheet: 0 -8px 30px rgba(0, 0, 0, 0.08);
            --transition: all 0.25s ease;
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--white);
            color: var(--dark);
            /* Leave space for the fixed summary bottom sheet */
            padding-bottom: 280px;
            overflow-x: hidden;
        }

        /* Responsive Layout Container */
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--white);
            min-height: 100vh;
            position: relative;
            box-shadow: var(--shadow-soft);
        }

        @media (min-width: 768px) {
            body { 
                background-color: #f5f5f5; 
                padding-bottom: 0;
            }
            .app-container {
                max-width: 900px;
                margin: 24px auto;
                border-radius: 20px;
                overflow: hidden;
                min-height: calc(100vh - 48px);
                padding-bottom: 24px;
            }
            .cart-layout-desktop {
                display: grid;
                grid-template-columns: 1fr 360px;
                gap: 24px;
                padding: 0 20px;
            }
        }

        /* Header */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--white);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
            flex: 1;
            text-align: center;
            margin-right: 42px; /* Balance out back button spacing */
        }

        .icon-btn {
            background: var(--white);
            border: 1px solid var(--light);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            transition: var(--transition);
        }

        .icon-btn:hover { background: var(--light); }
        .icon-btn svg { width: 20px; height: 20px; fill: var(--dark); }

        /* Cart Items List */
        .cart-list {
            display: flex;
            flex-direction: column;
        }

        .cart-item-wrapper {
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid var(--light);
            background: var(--white);
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: var(--white);
            position: relative;
            z-index: 2;
            transition: transform 0.25s ease;
        }

        /* Swipe / Revealing Delete Action (Visualized in 3rd item as active) */
        .cart-item-wrapper.swipe-open .cart-item {
            transform: translateX(-70px);
        }

        .delete-action-bg {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 70px;
            background: var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
            cursor: pointer;
            transition: var(--transition);
        }

        .delete-action-bg:hover {
            background: #e0e0e0;
        }

        .delete-action-bg svg {
            width: 20px;
            height: 20px;
            fill: var(--dark);
        }

        .product-img-placeholder {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background-color: #D9D9D9;
            flex-shrink: 0;
        }

        .item-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .item-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark);
        }

        .item-variant {
            font-size: 13px;
            color: var(--gray);
            font-weight: 400;
        }

        .item-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
            margin-top: 4px;
        }

        /* Quantity Controls */
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
            align-self: flex-end;
            margin-bottom: 2px;
        }

        .qty-btn {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .qty-btn.minus {
            background: var(--light);
            color: var(--dark);
        }

        .qty-btn.plus {
            background: var(--dark);
            color: var(--white);
        }

        .qty-btn:active {
            transform: scale(0.92);
        }

        .qty-val {
            font-size: 14px;
            font-weight: 600;
            color: var(--dark);
            min-width: 14px;
            text-align: center;
        }

        /* Bottom Sheet / Summary Panel */
        .summary-card {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px 20px calc(16px + env(safe-area-inset-bottom));
            box-shadow: var(--shadow-bottom-sheet);
            z-index: 100;
            border-top: 1px solid rgba(0,0,0,0.04);
        }

        @media (min-width: 768px) {
            .summary-card {
                position: relative;
                box-shadow: var(--shadow-soft);
                border-radius: 16px;
                border: 1px solid var(--light);
                padding: 24px;
                z-index: 1;
                align-self: start;
            }
        }

        /* Promo Code Box */
        .promo-container {
            display: flex;
            align-items: center;
            background: var(--white);
            border: 1px solid var(--light);
            border-radius: 30px;
            padding: 4px 4px 4px 16px;
            margin-bottom: 20px;
        }

        .promo-input {
            border: none;
            outline: none;
            flex: 1;
            font-size: 14px;
            color: var(--dark);
            background: transparent;
        }

        .promo-input::placeholder {
            color: var(--gray);
        }

        .apply-btn {
            background: var(--dark);
            color: var(--white);
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .apply-btn:hover {
            background: var(--primary);
        }

        /* Price Breakdown Rows */
        .price-breakdown {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: var(--gray);
        }

        .price-row.discount-row {
            color: var(--gray);
        }

        .price-row.total-row {
            border-top: 1px dashed var(--light);
            padding-top: 14px;
            font-size: 16px;
            font-weight: 700;
            color: var(--dark);
        }

        .price-row.total-row .row-val {
            font-size: 18px;
        }

        .checkout-btn {
            width: 100%;
            background: var(--dark);
            color: var(--white);
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: block;
            text-align: center;
            text-decoration: none;
        }

        .checkout-btn:hover {
            background: var(--primary);
        }

        .checkout-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <header>
        <button class="icon-btn" aria-label="Go Back" onclick="history.back()">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <h1 class="header-title">My Cart</h1>
    </header>

    <div class="cart-layout-desktop">
        <!-- Cart Items Container -->
        <div class="cart-list" id="cartList">
            <!-- Item 1 -->
            <div class="cart-item-wrapper">
                <div class="cart-item">
                    <div class="product-img-placeholder"></div>
                    <div class="item-details">
                        <span class="item-title">Brown Jacket</span>
                        <span class="item-variant">Size : XL</span>
                        <span class="item-price" data-price="83.97">$83.97</span>
                    </div>
                    <div class="quantity-control">
                        <button class="qty-btn minus" aria-label="Decrease quantity">−</button>
                        <span class="qty-val">1</span>
                        <button class="qty-btn plus" aria-label="Increase quantity">+</button>
                    </div>
                </div>
                <div class="delete-action-bg" aria-label="Delete item">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </div>
            </div>

            <!-- Item 2 -->
            <div class="cart-item-wrapper">
                <div class="cart-item">
                    <div class="product-img-placeholder"></div>
                    <div class="item-details">
                        <span class="item-title">Brown Suite</span>
                        <span class="item-variant">Size : XL</span>
                        <span class="item-price" data-price="120.00">$120</span>
                    </div>
                    <div class="quantity-control">
                        <button class="qty-btn minus" aria-label="Decrease quantity">−</button>
                        <span class="qty-val">1</span>
                        <button class="qty-btn plus" aria-label="Increase quantity">+</button>
                    </div>
                </div>
                <div class="delete-action-bg" aria-label="Delete item">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </div>
            </div>

            <!-- Item 3 (Shown with swipe delete revealed as in reference image) -->
            <div class="cart-item-wrapper swipe-open">
                <div class="cart-item">
                    <div class="product-img-placeholder"></div>
                    <div class="item-details">
                        <span class="item-title">Brown Jacket</span>
                        <span class="item-variant">Size : XL</span>
                        <span class="item-price" data-price="83.97">$83.97</span>
                    </div>
                    <div class="quantity-control">
                        <button class="qty-btn minus" aria-label="Decrease quantity">−</button>
                        <span class="qty-val">1</span>
                        <button class="qty-btn plus" aria-label="Increase quantity">+</button>
                    </div>
                </div>
                <div class="delete-action-bg" aria-label="Delete item">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </div>
            </div>

            <!-- Item 4 -->
            <div class="cart-item-wrapper">
                <div class="cart-item">
                    <div class="product-img-placeholder"></div>
                    <div class="item-details">
                        <span class="item-title">Brown Suite</span>
                        <span class="item-variant">Size : XL</span>
                        <span class="item-price" data-price="120.00">$120</span>
                    </div>
                    <div class="quantity-control">
                        <button class="qty-btn minus" aria-label="Decrease quantity">−</button>
                        <span class="qty-val">1</span>
                        <button class="qty-btn plus" aria-label="Increase quantity">+</button>
                    </div>
                </div>
                <div class="delete-action-bg" aria-label="Delete item">
                    <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </div>
            </div>
        </div>

        <!-- Sticky Bottom Sheet / Summary Card -->
        <div class="summary-card">
            <div class="promo-container">
                <input type="text" class="promo-input" placeholder="Promo Code">
                <button class="apply-btn">Apply</button>
            </div>

            <div class="price-breakdown">
                <div class="price-row">
                    <span>Sub-Total</span>
                    <span class="row-val" id="subTotal">$407.94</span>
                </div>
                <div class="price-row">
                    <span>Delivery Fee</span>
                    <span class="row-val" id="deliveryFee">$25.00</span>
                </div>
                <div class="price-row discount-row">
                    <span>Discount</span>
                    <span class="row-val" id="discount">-$35.00</span>
                </div>
                <div class="price-row total-row">
                    <span>Total Cost</span>
                    <span class="row-val" id="totalCost">$397.94</span>
                </div>
            </div>

            <button class="checkout-btn">Proceed to Checkout</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Quantity adjustment logic
        const cartItems = document.querySelectorAll('.cart-item-wrapper');

        cartItems.forEach(wrapper => {
            const minusBtn = wrapper.querySelector('.qty-btn.minus');
            const plusBtn = wrapper.querySelector('.qty-btn.plus');
            const qtyVal = wrapper.querySelector('.qty-val');
            const deleteBtn = wrapper.querySelector('.delete-action-bg');

            minusBtn?.addEventListener('click', () => {
                let current = parseInt(qtyVal.textContent);
                if (current > 1) {
                    qtyVal.textContent = current - 1;
                }
            });

            plusBtn?.addEventListener('click', () => {
                let current = parseInt(qtyVal.textContent);
                qtyVal.textContent = current + 1;
            });

            // Delete item handler
            deleteBtn?.addEventListener('click', () => {
                wrapper.style.transition = 'all 0.3s ease';
                wrapper.style.opacity = '0';
                wrapper.style.height = '0';
                wrapper.style.padding = '0';
                setTimeout(() => {
                    wrapper.remove();
                }, 300);
            });

            // Simple click toggle swipe preview
            const itemContent = wrapper.querySelector('.cart-item');
            itemContent.addEventListener('dblclick', () => {
                wrapper.classList.toggle('swipe-open');
            });
        });
    });
</script>

</body>
</html>

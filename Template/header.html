<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Shoop Moda Style Header with Mobile Dropdown Menu</title>
    <style>
        /* Design System Variables */
        :root {
            --primary: #704F38;
            --dark: #1F2029;
            --gray: #797979;
            --light: #EDEDED;
            --white: #FFFFFF;
            --shadow-soft: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-dropdown: 0 10px 30px rgba(0, 0, 0, 0.1);
            --transition: all 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #f5f5f5;
            padding: 20px 0;
        }

        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background: var(--white);
            box-shadow: var(--shadow-soft);
            position: relative;
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 1200px;
                border-radius: 16px;
            }
        }

        /* Top Announcement Bar */
        .announcement-bar {
            background: var(--dark);
            color: var(--white);
            padding: 6px 16px;
            font-size: 11px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 0.3px;
        }

        .announcement-text {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .announcement-text span {
            color: var(--primary);
            font-weight: 700;
        }

        .location-tag {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--light);
            font-size: 11px;
            opacity: 0.9;
        }

        .location-tag svg {
            width: 12px;
            height: 12px;
            fill: var(--primary);
        }

        /* Main Header Navigation */
        .main-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--white);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--light);
        }

        /* Brand Logo Area */
        .brand-logo-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-mark {
            width: 38px;
            height: 38px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.5px;
            box-shadow: 0 2px 8px rgba(112, 79, 56, 0.25);
            transition: var(--transition);
        }

        .brand-logo-link:hover .logo-mark {
            transform: rotate(-5deg) scale(1.05);
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--dark);
            letter-spacing: 0.5px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 9px;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Header Quick Actions */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            position: relative;
            background: var(--white);
            border: 1px solid var(--light);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .icon-btn:hover {
            background: var(--light);
            border-color: #d8d8d8;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--dark);
        }

        /* Mobile Hamburger Toggle Button */
        .menu-toggle-btn {
            display: flex;
        }

        @media (min-width: 768px) {
            .menu-toggle-btn {
                display: none; /* Hide hamburger menu on desktop */
            }
        }

        /* Badge Indicator for Cart / Wishlist */
        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--primary);
            color: var(--white);
            font-size: 10px;
            font-weight: 700;
            min-width: 17px;
            height: 17px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--white);
        }

        /* Desktop Navigation Links */
        .desktop-nav {
            display: none;
            gap: 24px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--dark);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }

        @media (min-width: 768px) {
            .desktop-nav {
                display: flex;
            }
            .announcement-bar {
                padding: 8px 32px;
                font-size: 12px;
            }
            .main-header {
                padding: 16px 32px;
            }
        }

        /* Mobile Dropdown Menu Drawer */
        .mobile-dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--white);
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            box-shadow: var(--shadow-dropdown);
            border-top: 1px solid var(--light);
            display: flex;
            flex-direction: column;
            padding: 12px 0 20px;
            z-index: 99;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: var(--transition);
        }

        .mobile-dropdown-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            text-decoration: none;
            color: var(--dark);
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }

        .dropdown-item:hover, .dropdown-item.active {
            background: rgba(112, 79, 56, 0.05);
            color: var(--primary);
        }

        .dropdown-item svg {
            width: 16px;
            height: 16px;
            fill: var(--gray);
            transition: var(--transition);
        }

        .dropdown-item:hover svg {
            fill: var(--primary);
            transform: translateX(3px);
        }

        .dropdown-divider {
            height: 1px;
            background: var(--light);
            margin: 8px 20px;
        }

        .dropdown-footer-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            font-size: 13px;
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .dropdown-footer-link svg {
            width: 18px;
            height: 18px;
            fill: var(--primary);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Top Announcement Bar -->
    <div class="announcement-bar">
        <div class="announcement-text">
            <span>✨ Turkish Luxury Fashion</span> • Fast Shipping Across Morocco
        </div>
        <div class="location-tag">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            Morocco
        </div>
    </div>

    <!-- Main Header -->
    <header class="main-header">
        <!-- Logo Section -->
        <a href="#" class="brand-logo-link">
            <div class="logo-mark">S</div>
            <div class="logo-text-group">
                <span class="brand-name">Shoop Moda</span>
                <span class="brand-subtitle">Style • Turkish</span>
            </div>
        </a>

        <!-- Desktop Navigation Bar -->
        <nav class="desktop-nav">
            <a href="#" class="nav-link active">Home</a>
            <a href="#" class="nav-link">Women</a>
            <a href="#" class="nav-link">Children</a>
            <a href="#" class="nav-link">Pajamas</a>
            <a href="#" class="nav-link">Flash Sale</a>
        </nav>

        <!-- Action Icons & Mobile Menu Button -->
        <div class="header-actions">
            <button class="icon-btn" aria-label="Search Products">
                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </button>
            <button class="icon-btn" aria-label="Wishlist">
                <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                <span class="badge">2</span>
            </button>
            <button class="icon-btn" aria-label="Cart">
                <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
                <span class="badge">3</span>
            </button>

            <!-- Mobile Hamburger Button -->
            <button class="icon-btn menu-toggle-btn" id="mobileMenuToggle" aria-label="Toggle Navigation Menu">
                <svg id="hamburgerIcon" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                <svg id="closeIcon" viewBox="0 0 24 24" style="display: none;"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
        </div>

        <!-- Mobile Dropdown Navigation Menu -->
        <nav class="mobile-dropdown-menu" id="mobileDropdown">
            <a href="#" class="dropdown-item active">
                <span>Home</span>
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>
            <a href="#" class="dropdown-item">
                <span>Women's Fashion</span>
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>
            <a href="#" class="dropdown-item">
                <span>Children's Clothing</span>
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>
            <a href="#" class="dropdown-item">
                <span>Pajamas & Home Wear</span>
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>
            <a href="#" class="dropdown-item">
                <span>Flash Sale 🔥</span>
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
            </a>
            <div class="dropdown-divider"></div>
            <a href="https://wa.me/212725605520" target="_blank" class="dropdown-footer-link">
                <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
                Chat on WhatsApp (+212 725-605520)
            </a>
        </nav>
    </header>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('mobileMenuToggle');
        const dropdown = document.getElementById('mobileDropdown');
        const hamburgerIcon = document.getElementById('hamburgerIcon');
        const closeIcon = document.getElementById('closeIcon');

        toggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const isOpen = dropdown.classList.toggle('active');
            
            if (isOpen) {
                hamburgerIcon.style.display = 'none';
                closeIcon.style.display = 'block';
            } else {
                hamburgerIcon.style.display = 'block';
                closeIcon.style.display = 'none';
            }
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!dropdown.contains(e.target) && !toggleBtn.contains(e.target)) {
                dropdown.classList.remove('active');
                hamburgerIcon.style.display = 'block';
                closeIcon.style.display = 'none';
            }
        });
    });
</script>

</body>
</html>
